<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>工学院大学GPA計算機</title>
    <meta name="description" content="工学院大学GPA計算機へのログイン。工学院大学のGoogleアカウント（@g.kogakuin.jp）が必要です。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../icon.ico">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="style.css?v=login-20260830-3">
</head>

<body class="login-body">
    <div id="login-prompt" class="login-prompt" data-auth-pending aria-busy="true" style="display: block;">
        <div class="login-sculpture" aria-hidden="true"></div>

        <a href="../" class="login-brand" aria-label="工学院大学GPA計算機 トップへ">
            <img src="../icon.ico" alt="" class="login-logo">
            <span>工学院大学GPA計算機</span>
        </a>

        <main class="login-shell">
            <section class="login-form" aria-labelledby="login-title">
                <div class="login-form-inner">
                    <h1 id="login-title">ログイン</h1>
                    <p class="login-desc">
                        <span class="login-account-label">Googleアカウント <strong>@g.kogakuin.jp</strong></span>
                        <span id="login-domain-error" class="login-domain-error-message" role="alert"
                            aria-live="assertive"></span>
                    </p>

                    <div class="legal-consent-group" role="group" aria-label="利用条件への同意">
                        <div class="legal-consent-row">
                            <input type="checkbox" id="terms-checkbox" data-login-consent aria-required="true" aria-label="利用規約に同意する">
                            <label for="terms-checkbox"><a href="../terms/" target="_blank" rel="noopener noreferrer">利用規約</a>に同意する</label>
                        </div>
                        <div class="legal-consent-row">
                            <input type="checkbox" id="privacy-checkbox" data-login-consent aria-required="true" aria-label="プライバシーポリシーに同意する">
                            <label for="privacy-checkbox"><a href="../privacy/" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>に同意する</label>
                        </div>
                    </div>

                    <button id="login-button" class="login-button" disabled>
                        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        <span>Googleでログイン</span>
                    </button>

                    <p class="login-notice-text">工学院大学の公式サービスではありません。</p>
                </div>

                <p class="copyright">Copyright © 2024-2026 SAYU.</p>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
    <script src="../app.js?v=release-20260831-9"></script>
</body>

</html>
