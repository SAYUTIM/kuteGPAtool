name: Temporary course popup fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-course-popup-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current artifact and apply fix
        shell: bash
        run: |
          set -euo pipefail
          current_blob="$(git hash-object app.js)"
          test "$current_blob" = "6ab575d5bd157a54dc99f11a3b92f23164d4f17b"

          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          s = path.read_text(encoding='utf-8')

          old1 = "function loadSyllabusData(){if(syllabusDataCache)return syllabusDataCache;const _0x23f012=await fetchJson('./dataset/dataset_syllabus.json','syllabus.load');if(!_0x23f012)return[];return syllabusDataCache=_0x23f012,syllabusLookupCache=buildSyllabusLookupCache(_0x23f012),syllabusDataCache;}function buildSyllabusLookupCache(_0x25a497)"
          new1 = "function loadSyllabusData(){if(syllabusDataCache)return syllabusDataCache;const _0x23f012=await fetchJson('./dataset/dataset_syllabus.json','syllabus.load');if(!_0x23f012)return[];return syllabusDataCache=_0x23f012,syllabusLookupCache=buildSyllabusLookupCache(_0x23f012),syllabusDataCache;}function normalizeCourseNameForLookup(_0x1d5b7a){return String(_0x1d5b7a??'')['normalize']('NFKC')['replace'](/[･・]/g,'・')['replace'](/[\\s\\u3000]+/g,'\\x20')['trim']()['replace'](/\\s+(?=\\(PBL\\)$)/i,'')['replace'](/\\s+((?:(?:I|II|III)[A-D])|(?:I|II|III|IV|V|VI|VII|VIII|IX|X)|[A-D]|[1-4])(?=(?:\\(PBL\\))?$)/i,'$1');}function buildSyllabusLookupCache(_0x25a497)"
          new1 = (new1
              .replace('/[\\\\s\\\\u3000]+/g', '/[\\s\\u3000]+/g')
              .replace('/\\\\s+', '/\\s+')
              .replace('(?=\\\\(PBL\\\\)$)', '(?=\\(PBL\\)$)')
              .replace('(?=(?:\\\\(PBL\\\\))?$)', '(?=(?:\\(PBL\\))?$)'))

          old2 = "String(_0x3aee29['courseName'])['split']('|')['map'](_0x3acbf0=>_0x3acbf0['trim']())['filter'](Boolean)"
          new2 = "String(_0x3aee29['courseName'])['split']('|')['map'](normalizeCourseNameForLookup)['filter'](Boolean)"

          old3 = "const _0x261a17=_0x5c2404['trim']();"
          new3 = "const _0x261a17=normalizeCourseNameForLookup(_0x5c2404);"

          for old in (old1, old2, old3):
              if s.count(old) != 1:
                  raise SystemExit(f'expected one patch target, got {s.count(old)}')

          s = s.replace(old1, new1, 1).replace(old2, new2, 1).replace(old3, new3, 1)
          path.write_text(s, encoding='utf-8', newline='')
          PY

          node --check app.js
          test "$(git hash-object app.js)" = "752c99d3b6ef2f8697756c2da2799562283706a1"

      - name: Verify regression case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import unicodedata

          with open('dataset/dataset_syllabus.json', encoding='utf-8') as f:
              data = json.load(f)

          def normalize(value):
              value = unicodedata.normalize('NFKC', str(value or '')).replace('･', '・')
              value = re.sub(r'[\s\u3000]+', ' ', value).strip()
              value = re.sub(r'\s+(?=\(PBL\)$)', '', value, flags=re.I)
              value = re.sub(r'\s+((?:(?:I|II|III)[A-D])|(?:I|II|III|IV|V|VI|VII|VIII|IX|X)|[A-D]|[1-4])(?=(?:\(PBL\))?$)', r'\1', value, flags=re.I)
              return value

          needle = normalize('並列･分散システム')
          matches = [
              item for item in data
              if any(normalize(alias) == needle for alias in str(item.get('courseName', '')).split('|'))
          ]
          assert any(item.get('id') == 183 for item in matches), matches
          PY

      - name: Commit fixed obfuscated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize course names in statistics popup"
          git push origin HEAD:main
