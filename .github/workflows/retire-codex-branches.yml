name: Retire backed-up Codex branches

on:
  push:
    paths:
      - '.github/workflows/retire-codex-branches.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve syllabus commit in main history without changing files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SAYUTIM branch retirement'
          git config user.email '108171999+SAYUTIM@users.noreply.github.com'
          git fetch origin codex/syllabus-2026-validation codex/production-readiness-20260831

          BEFORE_TREE="$(git rev-parse HEAD^{tree})"
          git merge --strategy=ours --no-ff origin/codex/syllabus-2026-validation \
            -m 'Preserve syllabus validation history before branch retirement'
          AFTER_TREE="$(git rev-parse HEAD^{tree})"

          test "$BEFORE_TREE" = "$AFTER_TREE"
          git merge-base --is-ancestor 430351624205b4e11dfa60271f0f1040bc1a04eb HEAD
          git push origin HEAD:main

      - name: Delete retired public branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete codex/syllabus-2026-validation
          git push origin --delete codex/production-readiness-20260831
